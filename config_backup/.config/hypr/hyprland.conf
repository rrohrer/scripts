# ============================================================
#  Hyprland — vim-style meta navigation, gruvbox-material warm
#  Wallpaper: ~/Pictures/Wallpapers/monument-valley-sunset.jpg
# ============================================================

################
### MONITORS ###
################
# Samsung U32J59x — 4K. `preferred` keeps this portable to other displays.
monitor = , preferred, auto, 1


###################
### MY PROGRAMS ###
###################
$terminal    = kitty
$fileManager = dolphin
$menu        = wofi --show drun
$browser     = firefox


#################
### AUTOSTART ###
#################
exec-once = swaybg -i ~/Pictures/Wallpapers/monument-valley-sunset.jpg -m fill
exec-once = dunst
exec-once = waybar


#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2

    # Warm sunset gradient pulled from the wallpaper (orange -> amber)
    col.active_border = rgba(e78a4eee) rgba(d8a657ee) 45deg
    col.inactive_border = rgba(3c3836aa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(1a120bcc)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = overshot, 0.13, 0.99, 0.29, 1.10
    bezier = smoothOut, 0.36, 0, 0.66, -0.56

    animation = windows, 1, 6, wind, slide
    animation = windowsOut, 1, 5, smoothOut, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 30, default, loop
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, overshot, slidevert
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}


#############
### INPUT ###
#############
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace


###################
### KEYBINDINGS ###
###################
# $mainMod is the "meta" (SUPER / Windows) key.
$mainMod = SUPER

# --- Apps & session ---
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, Space, exec, $menu
bind = $mainMod SHIFT, Q, exit,

# --- Window state ---
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, P, pseudo,
bind = $mainMod, S, layoutmsg, togglesplit

# --- Vim-style focus movement (meta + hjkl) ---
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# --- Vim-style window movement (meta + shift + hjkl) ---
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r

# --- Vim-style resizing (meta + ctrl + hjkl, hold to repeat) ---
binde = $mainMod CTRL, h, resizeactive, -40 0
binde = $mainMod CTRL, l, resizeactive, 40 0
binde = $mainMod CTRL, k, resizeactive, 0 -40
binde = $mainMod CTRL, j, resizeactive, 0 40

# --- Workspaces (meta + number) ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# --- Move active window to workspace (meta + shift + number) ---
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- Scratchpad ---
bind = $mainMod, U, togglespecialworkspace, magic
bind = $mainMod SHIFT, U, movetoworkspace, special:magic

# --- Cycle workspaces / windows with the scroll wheel ---
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, Tab, cyclenext,
bind = $mainMod SHIFT, Tab, cyclenext, prev

# --- Move / resize windows with the mouse ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Screenshots (grim + slurp) ---
bind = , Print, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# --- Media & volume keys (pipewire via wpctl) ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous

# --- Brightness keys (touchbar via hid-appletb-kbd) ---
bindel = , XF86MonBrightnessUp, exec, brightnessctl -d acpi_video0 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -d acpi_video0 set 5%-
bindel = , XF86KbdBrightnessUp, exec, brightnessctl -d :white:kbd_backlight set 10%+
bindel = , XF86KbdBrightnessDown, exec, brightnessctl -d :white:kbd_backlight set 10%-


##############################
### WINDOWS AND WORKSPACES ###
##############################
windowrule = suppress_event maximize, match:class .*
windowrule = no_focus 1, match:class ^$, match:title ^$, match:xwayland 1, match:fullscreen 0
windowrule = float 1, match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = float 1, match:class ^(org.kde.dolphin)$, match:title ^(Copying|Moving|Deleting).*
