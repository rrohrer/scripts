# ============================================================
#  kitty — Gruvbox Material (soft dark) + Hack Nerd Font
#  Palette matches the ghostty/alacritty dotfiles + warm wallpaper
# ============================================================

# --- Fonts -------------------------------------------------
font_family      Hack Nerd Font Mono
bold_font        Hack Nerd Font Mono Bold
italic_font      Hack Nerd Font Mono Italic
bold_italic_font Hack Nerd Font Mono Bold Italic
font_size        12.0
disable_ligatures never
adjust_line_height 110%

# --- Window ------------------------------------------------
background_opacity      0.95
dynamic_background_opacity yes
window_padding_width    10
window_margin_width     0
hide_window_decorations  yes
confirm_os_window_close  0
enable_audio_bell        no
scrollback_lines         10000
cursor_shape             beam
cursor_blink_interval    0
mouse_hide_wait          2.0
copy_on_select           yes
strip_trailing_spaces    smart

# --- Tab bar -----------------------------------------------
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #32302f
active_tab_background   #d8a657
active_tab_font_style   bold
inactive_tab_foreground #d4be98
inactive_tab_background #3c3836

# ============================================================
#  Gruvbox Material — soft dark
# ============================================================
foreground              #d4be98
background              #32302f
selection_foreground    #d4be98
selection_background    #45403d
cursor                  #d4be98
cursor_text_color       #32302f
url_color               #89b482

# marks / borders
active_border_color     #d8a657
inactive_border_color   #45403d
bell_border_color       #ea6962

# normal
color0  #45403d
color1  #ea6962
color2  #a9b665
color3  #d8a657
color4  #7daea3
color5  #d3869b
color6  #89b482
color7  #d4be98
# bright
color8  #45403d
color9  #ea6962
color10 #a9b665
color11 #d8a657
color12 #7daea3
color13 #d3869b
color14 #89b482
color15 #d4be98
# extended (gruvbox material orange)
color16 #e78a4e
color17 #e78a4e
